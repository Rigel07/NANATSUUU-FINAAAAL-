name: Compilar mod desde el ZIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Descomprimir el ZIP del proyecto
        run: |
          ZIP=$(ls -t *.zip 2>/dev/null | head -n1)
          if [ -z "$ZIP" ]; then echo "No hay ningun .zip en la raiz del repositorio"; exit 1; fi
          echo "Usando $ZIP"
          rm -rf _proyecto && mkdir _proyecto
          unzip -q -o "$ZIP" -d _proyecto
          GRADLE_FILE=$(find _proyecto -name build.gradle | head -n1)
          if [ -z "$GRADLE_FILE" ]; then echo "El ZIP no contiene build.gradle"; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$GRADLE_FILE")" >> "$GITHUB_ENV"

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Compilar
        run: |
          cd "$PROJECT_DIR"
          gradle build --no-daemon --stacktrace

      - name: Subir el .jar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: NanatsuChaos-jar
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar

      - name: Publicar el .jar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: NanatsuChaos build ${{ github.run_number }}
          files: ${{ env.PROJECT_DIR }}/build/libs/*.jar
